---
layout: default
title: Blog
---
<div class="wrap">
  <h1>Blog</h1>
  {% if site.posts.size == 0 %}
    <p>Nothing here yet — first post coming soon.</p>
  {% else %}
    <ul class="post-list">
      {% for post in site.posts %}
        <li>
          <span class="post-date">{{ post.date | date: "%B %-d, %Y" }}</span>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
