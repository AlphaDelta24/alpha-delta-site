---
layout: default
title: Unsubscribe
noindex: true
---
<div class="wrap" style="text-align: center; max-width: 440px;">
  <h1>Unsubscribe</h1>
  <p>Enter the email address you signed up with, and we'll remove you from the Alpha Delta Studios list.</p>

  <form class="signup" id="unsub-form">
    <label for="email" style="position:absolute; left:-9999px;">Email address</label>
    <input type="email" id="email" name="email" placeholder="you@domain.com" required>
    <button type="submit" id="unsub-btn">Unsubscribe me</button>
  </form>
  <p class="signup-note" id="unsub-status"></p>
</div>

<script>
  document.getElementById('unsub-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const emailInput = document.getElementById('email');
    const btn = document.getElementById('unsub-btn');
    const status = document.getElementById('unsub-status');
    const email = emailInput.value.trim();
    if (!email) return;

    btn.disabled = true;
    status.textContent = 'Sending…';

    try {
      const res = await fetch('https://formsubmit.co/ajax/contact@alphadeltastudios.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          email: email,
          _subject: ['Unsubscribe', email].join(' ||| ')
        })
      });

      if (res.ok) {
        status.textContent = "You're unsubscribed. Sorry to see you go.";
        emailInput.value = '';
      } else {
        status.textContent = 'Something went wrong — try again in a moment.';
      }
    } catch (err) {
      status.textContent = 'Something went wrong — try again in a moment.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
