<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — Alpha Delta Studios</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #040F4F;
    --navy-panel: #121B4F;
    --green: #5FA636;
    --green-bright: #7CC13F;
    --white: #F5F7FA;
    --slate: #8B94AC;
    --line: rgba(245, 247, 250, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy-deep);
    color: var(--white);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 440px;
    width: 100%;
    padding: 40px 24px;
    text-align: center;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 12px;
  }

  p.sub {
    color: var(--slate);
    font-size: 0.95rem;
    margin: 0 0 32px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  input[type="email"] {
    width: 100%;
    background: var(--navy-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 13px 16px;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
  }

  input::placeholder {
    color: var(--slate);
  }

  input:focus,
  button:focus-visible {
    outline: 2px solid var(--green-bright);
    outline-offset: 2px;
  }

  button {
    background: var(--green);
    color: var(--navy-deep);
    border: none;
    border-radius: 6px;
    padding: 13px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover {
    background: var(--green-bright);
  }

  .status {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--slate);
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Unsubscribe</h1>
    <p class="sub">Enter the email address you signed up with, and we'll remove you from the Alpha Delta Studios list.</p>

    <form id="unsub-form">
      <label for="email" style="position:absolute; left:-9999px;">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@domain.com" required>
      <button type="submit" id="unsub-btn">Unsubscribe me</button>
    </form>
    <p class="status" id="unsub-status"></p>
  </div>

  <script>
    document.getElementById('unsub-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const emailInput = document.getElementById('email');
      const btn = document.getElementById('unsub-btn');
      const status = document.getElementById('unsub-status');
      const email = emailInput.value.trim();
      if (!email) return;

      btn.disabled = true;
      status.textContent = 'Sending…';

      try {
        const res = await fetch('https://formsubmit.co/ajax/contact@alphadeltastudios.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            email: email,
            _subject: ['Unsubscribe', email].join(' ||| ')
          })
        });

        if (res.ok) {
          status.textContent = "You're unsubscribed. Sorry to see you go.";
          emailInput.value = '';
        } else {
          status.textContent = 'Something went wrong — try again in a moment.';
        }
      } catch (err) {
        status.textContent = 'Something went wrong — try again in a moment.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
