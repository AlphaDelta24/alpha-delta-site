<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Coming Soon — Alpha Delta Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #040F4F;
    --navy-panel: #121B4F;
    --green: #5FA636;
    --green-bright: #7CC13F;
    --white: #F5F7FA;
    --slate: #8B94AC;
    --line: rgba(245, 247, 250, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy-deep);
    color: var(--white);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 440px;
    width: 100%;
    padding: 40px 24px;
    text-align: center;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 12px;
  }

  p {
    color: var(--slate);
    font-size: 0.95rem;
    margin: 0 0 32px;
  }

  a.back {
    display: inline-block;
    color: var(--green-bright);
    text-decoration: none;
    font-size: 0.9rem;
  }

  a.back:hover {
    color: var(--white);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Social's on the way.</h1>
    <p>We're not on anything yet — once we are, it'll show up here. Sign up for the mailing list on the main page if you want to hear about it first.</p>
    <a class="back" href="index.html">&larr; Back to Alpha Delta Studios</a>
  </div>
</body>
</html>
